name: feishu-sync
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: feishu-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 拉取 team-skills（deploy key，只读）
        env:
          KEY: ${{ secrets.TEAM_SKILLS_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/k"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/k"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/k -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:__SKILLS_REPO__.git "$RUNNER_TEMP/team-skills"
      - name: 安装 pdftotext
        run: sudo apt-get install -y -q poppler-utils
      - name: 同步飞书 → markdown
        id: sync
        env:
          FEISHU_ALERT_APP_ID: ${{ secrets.FEISHU_ALERT_APP_ID }}
          FEISHU_ALERT_APP_SECRET: ${{ secrets.FEISHU_ALERT_APP_SECRET }}
        run: |
          rc=0
          python3 "$RUNNER_TEMP/team-skills/feishu-sync/scripts/sync.py" --config feishu-sync.toml || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: 有变化则提交
        run: |
          git config user.name "feishu-sync[bot]"
          git config user.email "feishu-sync@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "chore(feishu-sync): $(git diff --cached --name-status | awk '{print $1}' | sort | uniq -c | tr -s ' ' | tr '\n' ' ')"
            git push
          fi
      - name: 部分文档失败则标红
        if: steps.sync.outputs.rc != '0'
        run: exit 1
